<style>

/* HEADER */
header {
  text-align: center;
  padding: 70px 20px;
  background: radial-gradient(circle at top, #1e293b, #0a0f1c);
}

/* PROFILE IMAGE */
.profile-img {
  width: 170px;
  height: 170px;
  border-radius: 50%;

  border: 4px solid #38bdf8;

header h1 {
  font-size: 52px;
  margin: 0;

header p {

}

/* SOCIAL */
.social-links {

  text-decoration: none;
  border-radius: 8px;
  background: rgba(17,24,39,0.8);
  border: 1px solid #334155;
  color: #e5e7eb;
  transition: 0.3s;
}

.social-links a:hover {
  border-color: #38bdf8;
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(56,189,248,0.2);
}

/* SECTION */
section {
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
}

h2 {
  color: #38bdf8;
  border-left: 4px solid #38bdf8;

.card {
  background: rgba(17, 24, 39, 0.7);
  padding: 20px;
  border-radius: 14px;
  margin-top: 15px;
}

/* FOOTER */
footer {
